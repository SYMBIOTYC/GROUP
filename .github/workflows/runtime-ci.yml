name: GROUP runtime unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run runtime unit tests
        run: node --test tests/*.test.mjs
      - name: Compile and run AMPHETAMIN C policy tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/amphetamin_policy.c tests/amphetamin_policy_test.c -o /tmp/amphetamin-policy-test
          /tmp/amphetamin-policy-test
