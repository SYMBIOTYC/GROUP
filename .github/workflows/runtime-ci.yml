name: GROUP runtime unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install wasm32 compiler and linker
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld
      - name: Compile the C policy as a freestanding wasm32 module
        run: |
          mkdir -p build
          clang --target=wasm32 -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -nostdlib -Isrc src/amphetamin_policy.c src/amphetamin_wasm.c \
            -Wl,--no-entry -Wl,--export-memory \
            -Wl,--export=amphetamin_abi_version \
            -Wl,--export=amphetamin_input_ptr \
            -Wl,--export=amphetamin_output_ptr \
            -Wl,--export=amphetamin_eval \
            -Wl,--initial-memory=131072 -Wl,--max-memory=131072 \
            -o build/amphetamin_policy.wasm
      - name: Run runtime, controller, WASM adapter, and Worker route tests
        env:
          AMPHETAMIN_WASM_PATH: build/amphetamin_policy.wasm
        run: node --test tests/*.test.mjs
      - name: Compile and run AMPHETAMIN C policy tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc src/amphetamin_policy.c tests/amphetamin_policy_test.c -o /tmp/amphetamin-policy-test
          /tmp/amphetamin-policy-test
      - name: Verify low-level wasm32 ABI round-trip
        env:
          AMPHETAMIN_WASM_PATH: build/amphetamin_policy.wasm
        run: node --test wasm-tests/amphetamin-wasm-abi.test.mjs
      - name: Verify Wrangler Worker bundle with the compiled WASM module
        run: npx --yes wrangler@latest deploy --dry-run --outdir=dist
