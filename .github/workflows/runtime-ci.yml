name: GROUP runtime unit tests

on:
  push:
    branches: [main, i0-26-6-migration-defect-fixes]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run runtime unit tests
        run: node --test tests/*.test.mjs
