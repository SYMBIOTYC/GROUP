name: GROUP runtime unit tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run runtime unit tests
        run: node --test tests/*.test.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Worker Registry migration and resolver tests
        run: |
          python tests/test_worker_registry_migration.py
          python tests/test_worker_credential_resolver_sqlite.py
