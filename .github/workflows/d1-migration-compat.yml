name: GROUP D1 local migration compatibility

on:
  push:
    branches: [i0-26-6-migration-defect-fixes]
  pull_request:
    paths:
      - "migrations/**"
      - "tests/d1/**"
      - "wrangler.d1-test.jsonc"
      - ".github/workflows/d1-migration-compat.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  d1-local-migrations:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Apply all migrations to isolated local D1
        run: |
          npx --yes wrangler@4 d1 migrations apply DB --local --force \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test
      - name: Seed isolated D1 fixtures
        run: |
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/seed.sql
      - name: B1 — revoked Worker heartbeat is rejected atomically
        shell: bash
        run: |
          set -euo pipefail
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-revoked-heartbeat.sql 2>&1); then
            echo "Expected revoked Worker heartbeat rejection, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "heartbeat rejected"
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/assert-revoked-heartbeat-rollback.sql
      - name: B2 — expired challenge supersession and live-slot fencing
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/replace-expired-challenge.sql
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-superseded-challenge-reopen.sql 2>&1); then
            echo "Expected superseded challenge to remain terminal, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "challenge claims and terminal state are immutable"
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-live-challenge-replacement.sql 2>&1); then
            echo "Expected live challenge to retain its unique slot, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "UNIQUE constraint failed"
      - name: B3 — immutable claims and one-way completion
        shell: bash
        run: |
          set -euo pipefail
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-idempotency-claim-mutation.sql 2>&1); then
            echo "Expected immutable claim mutation to fail, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "claims are immutable"
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/complete-provisioning-request.sql
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-completed-request-reopen.sql 2>&1); then
            echo "Expected completed request to be immutable, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "claims are immutable"
          if output=$(npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/reject-completed-worker-rebind.sql 2>&1); then
            echo "Expected completed request Worker binding to be immutable, but SQL succeeded"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "claims are immutable"
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/assert-provisioning-request-completed.sql
      - name: Verify six applied migrations and foreign-key integrity
        run: |
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-test.jsonc --persist-to .wrangler/d1-test \
            --file tests/d1/assert-migration-ledger-and-fk.sql
      - name: Verify failed migration rolls back without losing prior migration
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 d1 migrations apply DB --local --force \
            --config wrangler.d1-rollback-test.jsonc --persist-to .wrangler/d1-rollback
          if output=$(npx --yes wrangler@4 d1 migrations apply DB --local --force \
            --config wrangler.d1-rollback-test.jsonc --persist-to .wrangler/d1-rollback 2>&1); then
            echo "Expected the deliberately failing migration to abort"
            exit 1
          fi
          echo "$output"
          echo "$output" | grep -q "table_that_does_not_exist"
          npx --yes wrangler@4 d1 execute DB --local \
            --config wrangler.d1-rollback-test.jsonc --persist-to .wrangler/d1-rollback \
            --command "CREATE TABLE d1_test_assertions (ok INTEGER NOT NULL CHECK (ok = 1)); INSERT INTO d1_test_assertions SELECT CASE WHEN (SELECT COUNT(*) FROM d1_migrations) = 1 AND EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='migration_baseline') AND NOT EXISTS (SELECT 1 FROM sqlite_master WHERE type='table' AND name='migration_rollback_probe') AND (SELECT COUNT(*) FROM migration_baseline) = 1 THEN 1 ELSE 0 END; DROP TABLE d1_test_assertions;"
